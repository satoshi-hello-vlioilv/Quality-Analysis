# CLAUDE.md の「push 前の確かめ」を GitHub でも回す。
# - program: アプリは Python の標準の部品だけで動く（版 3.8.0 で Flask を外した）ので、部品は入れずに試す（入れないこと自体が確かめ）
# - desktop: 窓（Rust・Tauri）の書式・作成・試験と、本物の窓（WebKitGTK）での自己診断（Windows の WebView2 は desktop.yml）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # 配る物に同梱する Python と同じ
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Ubuntu 24.04 は既定で、root でない人の名前空間（Chrome のサンドボックスが使う）を AppArmor で止めている。
      # 止まったままだと本物のブラウザの試験（test_lotdsp_direct.RealBrowser）で Chrome がすぐ終わるので外す。
      - name: Chrome のサンドボックスを使えるようにする
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: lint（画面の JS の文法）
        run: for f in program/app/static/js/*.js desktop/src/selftest.js; do node --check "$f"; done
      - name: lint（Python の文法）
        run: python -m compileall -q program
      - name: test（Python・アプリ）
        working-directory: program
        run: python -m unittest discover -s tests -t .

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TPA_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 窓を作る部品（WebKitGTK）と画面の無い X
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: lint（Rust の書式）
        working-directory: desktop
        run: cargo fmt --check
      - name: typecheck（Rust）
        working-directory: desktop
        run: cargo build --locked
      - name: test（Rust）
        working-directory: desktop
        run: cargo test --locked
      - name: 自己診断（本物の窓・WebKitGTK）
        run: |
          export TRANSFER_LOCAL_ROOT="$RUNNER_TEMP/root" TPA_SELFTEST="$RUNNER_TEMP/selftest.json"
          exe="$(python -c "import json;print(json.load(open('program/app/brand.json',encoding='utf-8'))['exe'][:-4])")"
          cd "$RUNNER_TEMP" && timeout 240 xvfb-run -a "$GITHUB_WORKSPACE/desktop/target/debug/$exe" || true
          python - <<'PY'
          import json, os, sys
          path = os.environ["TPA_SELFTEST"]
          if not os.path.exists(path):
              sys.exit("結果のファイルがありません")
          r = json.load(open(path, encoding="utf-8"))
          for x in r.get("results", []):
              print("PASS" if x["ok"] else "FAIL", x["name"], "--", x["info"])
          if r.get("error"):
              print("ERROR:", r["error"])
          sys.exit(0 if r.get("ok") else 1)
          PY
      - name: 記録
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/root/logs/*.log || true
