# CLAUDE.md の「push 前の確かめ」のうち、このリポジトリにある program の分を GitHub でも回す。
# アプリは Python の標準の部品だけで動く（版 3.8.0 で Flask を外した）ので、部品は入れずに試す（入れないこと自体が確かめ）。
# （Rust・desktop/bundle は desktop/ があるリポジトリの CI が受け持つ）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # 配る物に同梱する Python と同じ
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Ubuntu 24.04 は既定で、root でない人の名前空間（Chrome のサンドボックスが使う）を AppArmor で止めている。
      # 止まったままだと本物のブラウザの試験（test_lotdsp_direct.RealBrowser）で Chrome がすぐ終わるので外す。
      - name: Chrome のサンドボックスを使えるようにする
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # 本物のブラウザの試験は、Chrome が 15 秒のうちに DevTools を開くのを待つ（アプリの待ち時間）。CI の起こしたての
      # 機械では、その日初めての Chrome の起動（字体の一覧づくり・初回の準備）がこれを超え、最初の試験だけが落ちた。
      # 試験の前に一度起こしておく（アプリと試験の待ち時間は変えない）。
      - name: Chrome を一度起こしておく
        run: timeout 120 "$(command -v google-chrome || command -v chromium)" --headless=new --disable-gpu --no-first-run --dump-dom about:blank > /dev/null
      - name: lint（画面の JS の文法）
        run: for f in program/app/static/js/*.js; do node --check "$f"; done
      - name: lint（Python の文法）
        run: python -m compileall -q program
      - name: test（Python・アプリ）
        working-directory: program
        run: python -m unittest discover -s tests -t .
