# CLAUDE.md の「push 前の確かめ」を GitHub でも回す（型・構文・lint〔ruff・clippy〕・試験）。
# - program: アプリは Python の標準の部品だけで動く（版 3.8.0 で Flask を外した）ので、部品は入れずに試す（入れないこと自体が確かめ）
# - desktop: 窓（Rust・Tauri）の書式・作成・試験と、本物の窓（WebKitGTK）での自己診断（Windows の WebView2 は desktop.yml）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # 配る物に同梱する Python と同じ
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Ubuntu 24.04 は既定で、root でない人の名前空間（Chrome のサンドボックスが使う）を AppArmor で止めている。
      # 止まったままだと本物のブラウザの試験（test_lotdsp_direct.RealBrowser）で Chrome がすぐ終わるので外す。
      - name: Chrome のサンドボックスを使えるようにする
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: 型・構文（画面の JS・道具の JS）
        run: find program/app/static/js program/tools desktop/src -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: 型・構文（Python）
        run: python -m compileall -q program
      # 手元と同じ版の ruff（版が変わると決まりが増えて、手元で通った物が落ちる）
      - name: lint（Python・ruff）
        run: |
          pip install ruff==0.15.20
          ruff check program
      - name: test（Python・アプリ）
        working-directory: program
        run: python -m unittest discover -s tests -t .
      - name: test（Python・配る ZIP の組み立て）
        run: python -m unittest discover -s desktop/bundle -t desktop/bundle

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TPA_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 窓を作る部品（WebKitGTK）と画面の無い X
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      # 手元と同じ版（clippy は版が上がると決まりが増え、手元で通った物が落ちる）。上げるときは手元と一緒に上げる
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: lint（Rust の書式）
        working-directory: desktop
        run: cargo fmt --check
      - name: typecheck（Rust）
        working-directory: desktop
        run: cargo build --locked
      - name: lint（Rust・clippy）
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test（Rust）
        working-directory: desktop
        run: cargo test --locked
      # 異常ロット一覧を Rust と Python で引き比べるため、試験用の品質データ（3000 行）を参照先にした設定で起こす
      - name: 自己診断（本物の窓・WebKitGTK）
        run: |
          python program/tests/lotlist_fixture.py "$RUNNER_TEMP/q.sqlite3" 3000
          python program/tests/selftest_config.py "$RUNNER_TEMP/q.sqlite3" "$RUNNER_TEMP/appsettings.json"
          export TRANSFER_APP_CONFIG="$RUNNER_TEMP/appsettings.json"
          export TRANSFER_LOCAL_ROOT="$RUNNER_TEMP/root" TPA_SELFTEST="$RUNNER_TEMP/selftest.json"
          exe="$(python -c "import json;print(json.load(open('program/app/brand.json',encoding='utf-8'))['exe'][:-4])")"
          cd "$RUNNER_TEMP" && timeout 240 xvfb-run -a "$GITHUB_WORKSPACE/desktop/target/debug/$exe" || true
          python - <<'PY'
          import json, os, sys
          path = os.environ["TPA_SELFTEST"]
          if not os.path.exists(path):
              sys.exit("結果のファイルがありません")
          r = json.load(open(path, encoding="utf-8"))
          for x in r.get("results", []):
              print("PASS" if x["ok"] else "FAIL", x["name"], "--", x["info"])
          if r.get("error"):
              print("ERROR:", r["error"])
          sys.exit(0 if r.get("ok") else 1)
          PY
      # 更新の通し（desktop/bundle/verify.py）: 共有から写る → 裏で取り込む → 次の起動で入れ替わる → 壊れた版は控えへ戻す → 配る版を戻す
      - name: 更新の通し（本物の窓・WebKitGTK）
        run: xvfb-run -a python desktop/bundle/verify.py update --exe desktop/target/debug/$(python desktop/bundle/bundle.py brand exe | sed 's/\.exe$//') --work "$RUNNER_TEMP/verify"
      - name: 記録
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/root/logs/*.log || true
