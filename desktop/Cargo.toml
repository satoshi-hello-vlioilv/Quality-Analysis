[package]
name = "defect-analyzer-desktop"
version = "3.16.0"
description = "Defect-Analyzer（転写距離・ピッチ解析）デスクトップ版の窓"
edition = "2021"
rust-version = "1.90"
publish = false

# exe の名前は program/app/brand.json の exe と同じ（tests/test_brand.py が食い違いを止める）
# 窓に依らない処理（一覧・写し・Python と同じ書き方）。試験（tests/）からも使う
[lib]
name = "da_core"
path = "src/lib.rs"

[[bin]]
name = "Defect-Analyzer"
path = "src/main.rs"

[features]
# 起動画面を exe に埋め込む本番の形。外すと Tauri の開発の形になる
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# 品質データ（SQLite）を引く（src/lotlist.rs）。SQLite は exe に入れる（どの PC でも同じ版・窓関数が使える）
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup"] }
# 更新: 配る ZIP を展開する・指紋（SHA-256）を確かめる（src/update.rs）
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# 「N 日以内」の今日（この PC の暦）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 本物の Python を PID で見る・止める（src/proc.rs）・ショートカットを作る（src/lnk.rs）。版は Tauri が使っているものに合わせる（同じ crate を2つ持たない）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
