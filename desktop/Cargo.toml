[package]
name = "defect-analyzer-desktop"
version = "3.9.0"
description = "Defect-Analyzer（転写距離・ピッチ解析）デスクトップ版の窓"
edition = "2021"
rust-version = "1.90"
publish = false

# exe の名前は program/app/brand.json の exe と同じ（tests/test_brand.py が食い違いを止める）
[[bin]]
name = "Defect-Analyzer"
path = "src/main.rs"

[features]
# 起動画面を exe に埋め込む本番の形。外すと Tauri の開発の形になる
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 本物の Python を PID で見る・止める（src/proc.rs）。版は Tauri が使っているものに合わせる（同じ crate を2つ持たない）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
